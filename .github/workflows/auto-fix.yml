
name: 🚀 Deploy Site (Zip)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-zip:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Processar Atualização (ZIP)
        run: |
          # Configurar Git
          git config --global user.name "Flux Deployer"
          git config --global user.email "actions@github.com"
          
          # 1. Encontrar arquivo ZIP
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "✅ Nenhum arquivo .zip encontrado. Nada a fazer."
            exit 0
          fi
          
          echo "Found update package: $ZIP_FILE"
          
          # 2. Preparar extração
          rm -rf temp_extract
          mkdir -p temp_extract
          
          # 3. Extrair
          unzip -o "$ZIP_FILE" -d temp_extract
          
          # 4. Remover o ZIP original
          git rm --ignore-unmatch "$ZIP_FILE"
          rm -f "$ZIP_FILE"

          # --- CORREÇÃO DE SEGURANÇA ---
          # Remove qualquer pasta .github extraída para evitar erro de permissão
          echo "🛡️ Removendo configurações de workflow do pacote para evitar conflitos..."
          find temp_extract -name ".github" -type d -exec rm -rf {} +
          # -----------------------------
          
          # 5. Mover arquivos extraídos para a raiz
          if [ ! -f "temp_extract/package.json" ]; then
             # Se não tem package.json na raiz, procura subpasta
             SUBFOLDER=$(find temp_extract -maxdepth 2 -name "package.json" -exec dirname {} \; | head -n 1)
             if [ -n "$SUBFOLDER" ]; then
                echo "📂 Estrutura aninhada detectada. Movendo de: $SUBFOLDER"
                cp -rf "$SUBFOLDER"/. .
             else
                echo "📂 Estrutura plana assumida."
                cp -rf temp_extract/. .
             fi
          else
             echo "📂 Estrutura plana detectada."
             cp -rf temp_extract/. .
          fi
          
          # Limpeza
          rm -rf temp_extract
          
          # 6. Garantir permissões
          if [ -f "render-build.sh" ]; then
             chmod +x render-build.sh
             git update-index --chmod=+x render-build.sh 2>/dev/null || true
          fi
          
          # 7. Commit e Push
          git add .
          
          if ! git diff-index --quiet HEAD --; then
             git commit -m "🚀 Deploy via ZIP Upload"
             git push
             echo "✅ Código atualizado com sucesso."
          else
             echo "✅ Nenhuma mudança detectada nos arquivos extraídos."
          fi

          
